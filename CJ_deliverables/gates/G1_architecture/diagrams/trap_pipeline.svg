<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 370" role="img" aria-labelledby="ttl desc">
<title id="ttl">Five-stage exception and interrupt path</title><desc id="desc">Exceptions and interrupts enter or arise in the five pipeline stages. An accepted interrupt enters EX and the exception packet propagates to WB for trap commit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#62748a"/></marker><marker id="irqarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#bd3842"/></marker></defs>
<style>text{font-family:Arial, sans-serif;fill:#18202c}.stage{fill:#f8fafc;stroke:#2d56c8;stroke-width:1.5}.wb{fill:#f1fbf4;stroke:#15803d;stroke-width:1.7}.head{font-size:18px;font-weight:700}.body{font-size:13px}.minor{font-size:11px;fill:#526174}.arr{stroke:#62748a;stroke-width:2;fill:none;marker-end:url(#arrow)}.irq{fill:#fff5f5;stroke:#c92c37;stroke-width:1.5}.irqtxt{font-size:13px;font-weight:600;fill:#a52f38}.irqline{stroke:#c92c37;stroke-width:2.2;fill:none;marker-end:url(#irqarrow)}</style>
<rect x="15" y="118" width="180" height="214" rx="10" class="stage"/><text x="105" y="150" text-anchor="middle" class="head">IF</text><text x="105" y="173" text-anchor="middle" class="minor">fetch_cycle</text><text x="30" y="211" class="body"><tspan x="30">Instruction access fault (1)*</tspan><tspan x="30" dy="25">Instruction address misaligned (0)</tspan></text>
<rect x="220" y="118" width="180" height="214" rx="10" class="stage"/><text x="310" y="150" text-anchor="middle" class="head">ID</text><text x="310" y="173" text-anchor="middle" class="minor">decode_cycle</text><text x="235" y="211" class="body"><tspan x="235">Illegal instruction (2)</tspan><tspan x="235" dy="25">Breakpoint (3)</tspan><tspan x="235" dy="25">Environment call (11)</tspan><tspan x="235" dy="25">IF packet carried forward</tspan></text>
<rect x="425" y="118" width="180" height="214" rx="10" class="stage"/><text x="515" y="150" text-anchor="middle" class="head">EX</text><text x="515" y="173" text-anchor="middle" class="minor">execute_cycle</text><text x="440" y="211" class="body"><tspan x="440">Taken target misaligned (0)</tspan><tspan x="440" dy="25">IRQ accepted on valid EX item</tspan><tspan x="440" dy="25">Interrupt cause carried in packet</tspan></text>
<rect x="630" y="118" width="180" height="214" rx="10" class="stage"/><text x="720" y="150" text-anchor="middle" class="head">MEM</text><text x="720" y="173" text-anchor="middle" class="minor">memory_cycle</text><text x="645" y="211" class="body"><tspan x="645">Load misaligned (4)</tspan><tspan x="645" dy="25">Load access fault (5)</tspan><tspan x="645" dy="25">Store misaligned (6)</tspan><tspan x="645" dy="25">Store access fault (7)</tspan></text>
<rect x="835" y="118" width="190" height="214" rx="10" class="wb"/><text x="930" y="150" text-anchor="middle" class="head">WB</text><text x="930" y="173" text-anchor="middle" class="minor">writeback · wb_commit</text><text x="850" y="211" class="body"><tspan x="850">Trap commit</tspan><tspan x="850" dy="25">mepc · mcause · mtval</tspan><tspan x="850" dy="25">mtvec redirect · flush</tspan></text>
<path d="M195 275H218" class="arr"/><path d="M400 275H423" class="arr"/><path d="M605 275H628" class="arr"/><path d="M810 275H833" class="arr"/>
<rect x="425" y="20" width="180" height="54" rx="9" class="irq"/><text x="515" y="43" text-anchor="middle" class="irqtxt">Interrupt controller</text><text x="515" y="61" text-anchor="middle" class="minor">irq_arbiter · irq_pending</text><path d="M515 75V115" class="irqline"/><text x="528" y="99" class="minor" style="fill:#a52f38">inject at EX</text>
<text x="18" y="356" class="minor">* Fetch-range check is parameter-gated. Exception packet advances IF → ID → EX → MEM → WB; wb_commit commits at WB.</text>
</svg>