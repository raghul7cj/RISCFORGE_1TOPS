<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Standard Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#166534" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0369a1" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>

    <!-- Drop Shadow for Clean Elevation -->
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- ==================== OUTER BOUNDARY ==================== -->
  <rect x="25" y="20" width="1150" height="740" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,6" />
  <text x="50" y="52" fill="#0f172a" font-size="16" font-weight="700" letter-spacing="1">RISCFORGE 1TOPS SOC ARCHITECTURE</text>
  <text x="1000" y="52" fill="#64748b" font-size="12" font-weight="500">RV32IM / AXI4-Lite / APB</text>

  <!-- ==================== 1. CENTRAL AXI-LITE CROSSBAR ==================== -->
  <g filter="url(#subtleShadow)">
    <rect x="120" y="325" width="960" height="46" rx="4" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
    <text x="600" y="354" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">AXI-Lite CROSSBAR (2x3)</text>
  </g>

  <!-- ==================== 2. CPU CORE (TOP CENTER) ==================== -->
  <g filter="url(#subtleShadow)">
    <rect x="475" y="85" width="250" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
    <text x="600" y="118" fill="#14532d" font-size="15" font-weight="700" text-anchor="middle">RISCV CORE (top.v)</text>
    <text x="600" y="138" fill="#166534" font-size="12" font-weight="600" text-anchor="middle">5-Stage Pipeline (rv32im)</text>
    
    <!-- Sub-stages bar -->
    <rect x="495" y="152" width="210" height="34" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1" />
    <text x="516" y="174" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">IF</text>
    <line x1="537" y1="152" x2="537" y2="186" stroke="#bbf7d0" stroke-width="1" />
    <text x="558" y="174" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">ID</text>
    <line x1="579" y1="152" x2="579" y2="186" stroke="#bbf7d0" stroke-width="1" />
    <text x="600" y="174" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">EX</text>
    <line x1="621" y1="152" x2="621" y2="186" stroke="#bbf7d0" stroke-width="1" />
    <text x="642" y="174" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">MEM</text>
    <line x1="663" y1="152" x2="663" y2="186" stroke="#bbf7d0" stroke-width="1" />
    <text x="685" y="174" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">WB</text>
  </g>

  <!-- ==================== 3. INSTRUCTION MEMORY SUBSYSTEM (LEFT) ==================== -->
  
  <!-- ISRAM Stack Card Effect -->
  <g filter="url(#subtleShadow)">
    <rect x="75" y="95" width="160" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="70" y="100" width="160" height="90" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <text x="150" y="135" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Instruction SRAM</text>
    <text x="150" y="155" fill="#475569" font-size="11" font-weight="500" text-anchor="middle">4 KB (1024 x 32)</text>
    <text x="150" y="173" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">0x0000_0000</text>
  </g>

  <!-- ISRAM Mux (Trapezoid pointing Left towards SRAM) -->
  <g filter="url(#subtleShadow)">
    <path d="M 330 115 L 290 133 L 290 157 L 330 175 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8" />
    <text x="312" y="149" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">MUX</text>
  </g>
  <text x="310" y="105" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">isram_mux</text>

  <!-- AXI-to-SRAM Bridge 0 -->
  <g filter="url(#subtleShadow)">
    <rect x="270" y="235" width="80" height="42" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <text x="310" y="253" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Bridge</text>
    <text x="310" y="267" fill="#64748b" font-size="9" text-anchor="middle">(AXI-SRAM)</text>
  </g>

  <!-- ISRAM Connections -->
  <!-- Core Fetch -> Mux (Port 0) -->
  <line x1="475" y1="130" x2="330" y2="130" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="402" y="122" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">fetch bus</text>

  <!-- Crossbar MST[0] -> Bridge 0 -> Mux (Port 1) -->
  <line x1="310" y1="325" x2="310" y2="277" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="310" y1="235" x2="310" y2="168" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Mux Output -> Instruction SRAM -->
  <line x1="290" y1="145" x2="230" y2="145" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ==================== 4. DATA MEMORY & ROUTER SUBSYSTEM (RIGHT) ==================== -->

  <!-- Address Decoder / Hybrid Memory Router -->
  <g filter="url(#subtleShadow)">
    <rect x="765" y="115" width="105" height="60" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
    <text x="817" y="141" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">hybrid_mem_if</text>
    <text x="817" y="158" fill="#64748b" font-size="9.5" text-anchor="middle">(address router)</text>
  </g>

  <!-- Core LSU -> Router -->
  <line x1="725" y1="145" x2="765" y2="145" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="745" y="137" fill="#475569" font-size="9.5" font-weight="600" text-anchor="middle">LSU</text>

  <!-- DSRAM Mux (Trapezoid pointing Right towards SRAM) -->
  <g filter="url(#subtleShadow)">
    <path d="M 915 115 L 955 133 L 955 157 L 915 175 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8" />
    <text x="933" y="149" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">MUX</text>
  </g>
  <text x="935" y="105" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">dsram_mux</text>

  <!-- AXI-to-SRAM Bridge 1 -->
  <g filter="url(#subtleShadow)">
    <rect x="895" y="235" width="80" height="42" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <text x="935" y="253" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Bridge</text>
    <text x="935" y="267" fill="#64748b" font-size="9" text-anchor="middle">(AXI-SRAM)</text>
  </g>

  <!-- DSRAM Stack Card Effect -->
  <g filter="url(#subtleShadow)">
    <rect x="1000" y="95" width="150" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="995" y="100" width="150" height="90" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <text x="1070" y="135" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Data SRAM</text>
    <text x="1070" y="155" fill="#475569" font-size="11" font-weight="500" text-anchor="middle">4 KB (1024 x 32)</text>
    <text x="1070" y="173" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">0x0001_0000</text>
  </g>

  <!-- Router Native SRAM Out -> DSRAM Mux (Port 0) -->
  <line x1="870" y1="130" x2="915" y2="130" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="892" y="122" fill="#475569" font-size="9" font-weight="600" text-anchor="middle">data</text>

  <!-- Router AXI MMIO Out -> Crossbar SLV[0] -->
  <line x1="817" y1="175" x2="817" y2="325" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="838" y="255" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">MMIO (AXI)</text>

  <!-- Crossbar MST[1] -> Bridge 1 -> DSRAM Mux (Port 1) -->
  <line x1="935" y1="325" x2="935" y2="277" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="935" y1="235" x2="935" y2="168" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- DSRAM Mux Output -> Data SRAM -->
  <line x1="955" y1="145" x2="995" y2="145" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />


  <!-- ==================== 5. APB PERIPHERAL SUBSYSTEM (BOTTOM LEFT) ==================== -->

  <!-- AXI to APB Bridge -->
  <g filter="url(#subtleShadow)">
    <rect x="255" y="420" width="130" height="42" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <text x="320" y="438" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">AXI-to-APB</text>
    <text x="320" y="452" fill="#64748b" font-size="9" text-anchor="middle">Bridge</text>
  </g>

  <!-- Crossbar MST[2] -> APB Bridge -->
  <line x1="320" y1="371" x2="320" y2="420" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- APB Bridge -> APB Bus -->
  <line x1="320" y1="462" x2="320" y2="505" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- APB BUS BAR -->
  <g filter="url(#subtleShadow)">
    <rect x="100" y="505" width="670" height="42" rx="4" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
    <text x="435" y="531" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">APB BUS (Peripheral Space: 0x4000_0000 - 0x4FFF_FFFF)</text>
  </g>

  <!-- APB Slaves Boxes -->
  <!-- GPIO -->
  <g filter="url(#subtleShadow)">
    <rect x="105" y="585" width="85" height="55" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <text x="147" y="612" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">GPIO</text>
    <text x="147" y="628" fill="#64748b" font-size="9" text-anchor="middle">32-bit</text>
    <line x1="147" y1="547" x2="147" y2="585" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- UART -->
  <g filter="url(#subtleShadow)">
    <rect x="205" y="585" width="85" height="55" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <text x="247" y="612" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">UART</text>
    <text x="247" y="628" fill="#64748b" font-size="9" text-anchor="middle">16550</text>
    <line x1="247" y1="547" x2="247" y2="585" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- I2C -->
  <g filter="url(#subtleShadow)">
    <rect x="305" y="585" width="85" height="55" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <text x="347" y="612" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">I2C</text>
    <text x="347" y="628" fill="#64748b" font-size="9" text-anchor="middle">Master</text>
    <line x1="347" y1="547" x2="347" y2="585" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- TIMER -->
  <g filter="url(#subtleShadow)">
    <rect x="405" y="585" width="85" height="55" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <text x="447" y="612" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">TIMER</text>
    <text x="447" y="628" fill="#64748b" font-size="9" text-anchor="middle">Dual-Ch</text>
    <line x1="447" y1="547" x2="447" y2="585" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- SPI Master -->
  <g filter="url(#subtleShadow)">
    <rect x="505" y="585" width="85" height="55" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <text x="547" y="612" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">SPI</text>
    <text x="547" y="628" fill="#64748b" font-size="9" text-anchor="middle">Master</text>
    <line x1="547" y1="547" x2="547" y2="585" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- CLIC (Core Local Interrupt Controller) -->
  <g filter="url(#subtleShadow)">
    <rect x="675" y="585" width="95" height="55" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <text x="722" y="612" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">CLIC</text>
    <text x="722" y="628" fill="#64748b" font-size="9" text-anchor="middle">Interrupts</text>
    <line x1="722" y1="547" x2="722" y2="585" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- Peripheral IRQ bus to CLIC (dashed) -->
  <path d="M 147 640 L 147 670 L 705 670 L 705 640" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" />
  <line x1="247" y1="640" x2="247" y2="670" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" />
  <line x1="347" y1="640" x2="347" y2="670" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" />
  <line x1="447" y1="640" x2="447" y2="670" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" />
  <line x1="547" y1="640" x2="547" y2="670" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" />
  <text x="430" y="683" fill="#64748b" font-size="9.5" text-anchor="middle">peripheral IRQs</text>


  <!-- ==================== 6. AUTONOMOUS BOOTLOADER SUBSYSTEM (BOTTOM RIGHT) ==================== -->
  
  <g filter="url(#subtleShadow)">
    <rect x="850" y="440" width="270" height="120" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" />
    <text x="985" y="468" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">Autonomous Bootloader</text>
    
    <rect x="868" y="482" width="110" height="62" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2" />
    <text x="923" y="508" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">SPI Boot</text>
    <text x="923" y="524" fill="#64748b" font-size="9" text-anchor="middle">Master DMA</text>

    <rect x="992" y="482" width="110" height="62" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2" />
    <text x="1047" y="508" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Reset / Boot</text>
    <text x="1047" y="524" fill="#64748b" font-size="9" text-anchor="middle">Controller</text>
  </g>

  <!-- Bootloader Master to Crossbar SLV[1] -->
  <line x1="923" y1="440" x2="923" y2="371" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="955" y="405" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">boot AXI</text>

  <!-- Boot Done / Core Reset line to Core (dashed) -->
  <path d="M 1047 440 L 1047 280 L 725 280 L 725 185 L 725 185" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" />
  <text x="890" y="274" fill="#d97706" font-size="10" font-weight="600" text-anchor="middle">core_rst_n (boot release)</text>

  <!-- External SPI Flash Connection -->
  <g filter="url(#subtleShadow)">
    <rect x="895" y="600" width="180" height="48" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5" />
    <text x="985" y="622" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">External SPI Flash</text>
    <text x="985" y="637" fill="#64748b" font-size="9" text-anchor="middle">S25FS512S (QSPI)</text>
    <line x1="985" y1="560" x2="985" y2="600" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

</svg>
