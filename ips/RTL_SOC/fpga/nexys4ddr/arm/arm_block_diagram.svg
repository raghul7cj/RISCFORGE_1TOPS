<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650"><title>RISCFORGE arm demo: complete block diagram</title><desc>External devices (keyboard, laptop relay, U2D2, power hub, servos) connect to Nexys board chips (PIC24, FT2232, Pmod JA, switches, LEDs, QSPI flash), which connect to SoC peripherals: PIC24, switches and LEDs to GPIO; FT2232 and Pmod JA to UART; flash to SPI. Inside the SoC the RV32 core goes through the memory interface to SRAM and through the AXI-Lite crossbar and AXI-to-APB bridge to GPIO, UART, SPI, Timer0, I2C and Timer1. The bootloader uses SPI to copy firmware from flash into SRAM.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
  text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
  .t  { font-size: 14px; fill: #2C2C2A; }
  .th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .box { fill: #FFFFFF; stroke: #888780; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .c-gray > rect   { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray > .th    { fill: #444441; }  .c-gray > .ts   { fill: #5F5E5A; }
  .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple > .th  { fill: #3C3489; }  .c-purple > .ts { fill: #534AB7; }
  .c-teal > rect   { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal > .th    { fill: #085041; }  .c-teal > .ts   { fill: #0F6E56; }
  .c-coral > rect  { fill: #FAECE7; stroke: #993C1D; }
  .c-coral > .th   { fill: #712B13; }  .c-coral > .ts  { fill: #993C1D; }
</style>
<rect x="0" y="0" width="680" height="650" fill="#FFFFFF"/>
<g class="c-gray"><rect x="135" y="20" width="535" height="600" rx="20" stroke-width="0.5"/><text class="th" x="150" y="38" dominant-baseline="central">Nexys 4 DDR board</text></g>
<g class="c-purple"><rect x="285" y="55" width="375" height="480" rx="16" stroke-width="0.5"/><text class="th" x="300" y="72" dominant-baseline="central">RISCFORGE SoC, 32 MHz</text></g>
<g ><rect class="box" x="10" y="90" width="110" height="52" rx="8" stroke-width="0.5"/><text class="th" x="65" y="107" text-anchor="middle" dominant-baseline="central">Keyboard</text><text class="ts" x="65" y="125" text-anchor="middle" dominant-baseline="central">USB</text></g>
<g ><rect class="box" x="10" y="320" width="110" height="52" rx="8" stroke-width="0.5"/><text class="th" x="65" y="337" text-anchor="middle" dominant-baseline="central">Laptop</text><text class="ts" x="65" y="355" text-anchor="middle" dominant-baseline="central">relay + Vivado</text></g>
<g ><rect class="box" x="10" y="390" width="110" height="52" rx="8" stroke-width="0.5"/><text class="th" x="65" y="407" text-anchor="middle" dominant-baseline="central">U2D2</text><text class="ts" x="65" y="425" text-anchor="middle" dominant-baseline="central">USB to TTL</text></g>
<g ><rect class="box" x="10" y="460" width="110" height="52" rx="8" stroke-width="0.5"/><text class="th" x="65" y="477" text-anchor="middle" dominant-baseline="central">Power hub</text><text class="ts" x="65" y="495" text-anchor="middle" dominant-baseline="central">12 V</text></g>
<g ><rect class="box" x="10" y="530" width="110" height="52" rx="8" stroke-width="0.5"/><text class="th" x="65" y="547" text-anchor="middle" dominant-baseline="central">Servos</text><text class="ts" x="65" y="565" text-anchor="middle" dominant-baseline="central">IDs 1-6</text></g>
<g ><rect class="box" x="150" y="90" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="210" y="107" text-anchor="middle" dominant-baseline="central">PIC24</text><text class="ts" x="210" y="125" text-anchor="middle" dominant-baseline="central">USB to PS/2</text></g>
<g ><rect class="box" x="150" y="160" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="210" y="177" text-anchor="middle" dominant-baseline="central">Switches</text><text class="ts" x="210" y="195" text-anchor="middle" dominant-baseline="central">SW0-15, 5 BTN</text></g>
<g ><rect class="box" x="150" y="230" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="210" y="247" text-anchor="middle" dominant-baseline="central">LEDs</text><text class="ts" x="210" y="265" text-anchor="middle" dominant-baseline="central">LD4-LD15</text></g>
<g ><rect class="box" x="150" y="320" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="210" y="337" text-anchor="middle" dominant-baseline="central">FT2232</text><text class="ts" x="210" y="355" text-anchor="middle" dominant-baseline="central">UART + JTAG</text></g>
<g ><rect class="box" x="150" y="390" width="120" height="52" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="210" y="407" text-anchor="middle" dominant-baseline="central">Pmod JA</text><text class="ts" x="210" y="425" text-anchor="middle" dominant-baseline="central">direct, unused</text></g>
<g ><rect class="box" x="150" y="470" width="120" height="52" rx="8" stroke-width="0.5"/><text class="th" x="210" y="487" text-anchor="middle" dominant-baseline="central">QSPI flash</text><text class="ts" x="210" y="505" text-anchor="middle" dominant-baseline="central">bit + firmware</text></g>
<g class="c-teal"><rect x="295" y="90" width="100" height="192" rx="8" stroke-width="0.5"/><text class="th" x="345" y="166" text-anchor="middle" dominant-baseline="central">GPIO</text><text class="ts" x="345" y="186" text-anchor="middle" dominant-baseline="central">SW, BTN, PS/2</text><text class="ts" x="345" y="204" text-anchor="middle" dominant-baseline="central">LEDs, DIR</text></g>
<g class="c-teal"><rect x="295" y="320" width="100" height="122" rx="8" stroke-width="0.5"/><text class="th" x="345" y="363" text-anchor="middle" dominant-baseline="central">UART</text><text class="ts" x="345" y="383" text-anchor="middle" dominant-baseline="central">1 Mbps</text><text class="ts" x="345" y="401" text-anchor="middle" dominant-baseline="central">SW13 selects</text></g>
<g class="c-teal"><rect x="295" y="470" width="100" height="52" rx="8" stroke-width="0.5"/><text class="th" x="345" y="487" text-anchor="middle" dominant-baseline="central">SPI master</text><text class="ts" x="345" y="505" text-anchor="middle" dominant-baseline="central">boot only</text></g>
<g ><rect class="box" x="420" y="90" width="230" height="52" rx="8" stroke-width="0.5"/><text class="th" x="535" y="107" text-anchor="middle" dominant-baseline="central">RISC-V core</text><text class="ts" x="535" y="125" text-anchor="middle" dominant-baseline="central">RV32, 5-stage pipeline</text></g>
<g ><rect class="box" x="420" y="160" width="230" height="52" rx="8" stroke-width="0.5"/><text class="th" x="535" y="177" text-anchor="middle" dominant-baseline="central">Memory interface</text><text class="ts" x="535" y="195" text-anchor="middle" dominant-baseline="central">SRAM or MMIO</text></g>
<g ><rect class="box" x="420" y="230" width="100" height="52" rx="8" stroke-width="0.5"/><text class="th" x="470" y="247" text-anchor="middle" dominant-baseline="central">SRAM</text><text class="ts" x="470" y="265" text-anchor="middle" dominant-baseline="central">I 32K, D 32K</text></g>
<g ><rect class="box" x="550" y="230" width="100" height="52" rx="8" stroke-width="0.5"/><text class="th" x="600" y="247" text-anchor="middle" dominant-baseline="central">Bootloader</text><text class="ts" x="600" y="265" text-anchor="middle" dominant-baseline="central">+ boot ROM</text></g>
<g ><rect class="box" x="420" y="300" width="230" height="52" rx="8" stroke-width="0.5"/><text class="th" x="535" y="317" text-anchor="middle" dominant-baseline="central">AXI-Lite crossbar</text><text class="ts" x="535" y="335" text-anchor="middle" dominant-baseline="central">MMIO from 0x4000_0000</text></g>
<g ><rect class="box" x="420" y="370" width="230" height="52" rx="8" stroke-width="0.5"/><text class="th" x="535" y="387" text-anchor="middle" dominant-baseline="central">AXI to APB bridge</text><text class="ts" x="535" y="405" text-anchor="middle" dominant-baseline="central">+ bus timeout monitors</text></g>
<g class="c-teal"><rect x="420" y="450" width="70" height="52" rx="8" stroke-width="0.5"/><text class="th" x="455" y="467" text-anchor="middle" dominant-baseline="central">Timer0</text><text class="ts" x="455" y="485" text-anchor="middle" dominant-baseline="central">clock</text></g>
<g class="c-gray"><rect x="500" y="450" width="70" height="52" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="535" y="467" text-anchor="middle" dominant-baseline="central">I2C</text><text class="ts" x="535" y="485" text-anchor="middle" dominant-baseline="central">unused</text></g>
<g class="c-gray"><rect x="580" y="450" width="70" height="52" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="615" y="467" text-anchor="middle" dominant-baseline="central">Timer1</text><text class="ts" x="615" y="485" text-anchor="middle" dominant-baseline="central">unused</text></g>
<g ><rect class="box" x="150" y="552" width="240" height="52" rx="8" stroke-width="0.5"/><text class="th" x="270" y="569" text-anchor="middle" dominant-baseline="central">FPGA config logic</text><text class="ts" x="270" y="587" text-anchor="middle" dominant-baseline="central">JTAG write, boot from flash</text></g>
<g ><rect class="box" x="405" y="552" width="245" height="52" rx="8" stroke-width="0.5"/><text class="th" x="527" y="569" text-anchor="middle" dominant-baseline="central">Board top (top_arm.sv)</text><text class="ts" x="527" y="587" text-anchor="middle" dominant-baseline="central">MMCM 32 MHz, SW13 mux, PS/2</text></g>
