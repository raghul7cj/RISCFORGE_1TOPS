<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 262" width="100%" height="auto" role="img" aria-label="Current fixed-priority IRQ path">
<style>
svg { background: #ffffff; }
text { fill: #111111; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
.s { font-size: 9.5px; fill: #555555; }
.t { font-weight: 700; }
.b { fill: #ffffff; stroke: #111111; stroke-width: 1.2; }
.n { fill: #dedede; stroke: #111111; stroke-width: 2.2; }
.h { fill: #e2e5e9; stroke: #111111; stroke-width: 1.5; }
.m { fill: #f4f4f4; stroke: #111111; stroke-width: 1.2; }
.d { stroke-dasharray: 5 3; }
.a { stroke: #111111; stroke-width: 1.3; fill: none; marker-end: url(#ar); }
.l { stroke: #111111; stroke-width: 1.3; fill: none; }
</style>
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#111111"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Top Row: Peripheral Input to Priority Evaluation -->
<rect class="b" x="10" y="16" width="110" height="64"/>
<text class="t" x="18" y="32">Peripherals</text>
<text class="s" x="18" y="48">UART 19 · SPI 18</text>
<text class="s" x="18" y="60">I2C 17 · GPIO 16</text>
<text class="s" x="18" y="72">MTIP 7 · MSIP 3</text>

<rect class="h" x="140" y="16" width="110" height="64"/>
<text class="t" x="148" y="34">mip = wires</text>
<text class="s" x="148" y="50">no latch</text>
<text class="s" x="148" y="62" font-weight="700" fill="#111111">D1: pulse lost</text>

<rect class="b" x="270" y="16" width="80" height="64"/>
<text x="278" y="44">mip ∧ mie</text>

<rect class="h" x="370" y="16" width="150" height="64"/>
<text class="t" x="378" y="34">fixed priority chain</text>
<text class="s" x="378" y="50">19 &gt; 18 &gt; 17 &gt; 16 &gt; 11</text>
<text class="s" x="378" y="62" font-weight="700" fill="#111111">&gt; 7 &gt; 3 · D2: starvation</text>

<rect class="h" x="540" y="16" width="130" height="64"/>
<text class="t" x="548" y="34">cause &gt; mintprio</text>
<text class="s" x="548" y="50">compares cause IDs</text>
<text class="s" x="548" y="62" font-weight="700" fill="#111111">D3: not priorities</text>

<!-- Connectors: Top Row -->
<path class="a" d="M120 48H140"/>
<path class="a" d="M250 48H270"/>
<path class="a" d="M350 48H370"/>
<path class="a" d="M520 48H540"/>

<!-- Long Wrap-around Connection from Top Priority Stage to Pipeline Qualification -->
<path class="a" d="M605 80V104H55V134"/>

<!-- Bottom Row: Pipeline Qualification to Commit -->
<rect class="b" x="10" y="134" width="90" height="44"/>
<text x="18" y="152">mstatus.MIE</text>
<text class="s" x="18" y="166">global enable</text>

<rect class="b" x="120" y="134" width="90" height="44"/>
<text x="128" y="152">irq_pending</text>

<rect class="h" x="230" y="134" width="150" height="44"/>
<text class="t" x="238" y="152">accept @EX</text>
<text class="s" x="238" y="166" font-weight="700" fill="#111111">needs ¬stallMUL · D4</text>

<rect class="b" x="400" y="134" width="100" height="44"/>
<text x="408" y="152">tag → MEM</text>
<text class="s" x="408" y="166">older instrs retire</text>

<rect class="b" x="520" y="134" width="150" height="44"/>
<text class="t" x="528" y="152">commit @WB</text>
<text class="s" x="528" y="166">flush · PC ← mtvec / vector</text>

<!-- Connectors: Bottom Row -->
<path class="a" d="M100 156H120"/>
<path class="a" d="M210 156H230"/>
<path class="a" d="M380 156H400"/>
<path class="a" d="M500 156H520"/>

<!-- Suboptimal Areas Legend / Annotations -->
<text class="t" x="10" y="204">Areas of suboptimal implementation (shaded grey):</text>
<text class="s" x="10" y="220">D1  A single-cycle pulse is dropped if MIE = 0 or another ISR is running.</text>
<text class="s" x="10" y="233">D2  Fixed order lets UART / SPI traffic starve I2C and the timer tick.</text>
<text class="s" x="10" y="246">D3  Threshold compares cause numbers; the spec orders only the standard interrupts (verify wording).</text>
<text class="s" x="350" y="220">D4  A divide in EX blocks acceptance, so worst case is about 40 cycles</text>
<text class="s" x="350" y="233">against 6 uncontended (both to be measured).</text>
</svg>
