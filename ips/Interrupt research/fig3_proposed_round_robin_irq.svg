<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" width="100%" height="auto" role="img" aria-label="Two-Level Fixed-Priority plus Round-Robin Interrupt Architecture">
<style>
svg { background: #ffffff; }
text { fill: #111111; font-family: system-ui, -apple-system, sans-serif; font-size: 11px; }
.s { font-size: 9.5px; fill: #555555; }
.t { font-weight: 700; }
.b { fill: #ffffff; stroke: #111111; stroke-width: 1.2; }
.n { fill: #e5e7eb; stroke: #111111; stroke-width: 1.8; }
.m { fill: #f4f4f4; stroke: #111111; stroke-width: 1.2; }
.d { stroke-dasharray: 5 3; }
.a { stroke: #111111; stroke-width: 1.3; fill: none; marker-end: url(#ar); }
.l { stroke: #111111; stroke-width: 1.3; fill: none; }
.f1 { fill: #dedede; stroke: #111111; }
.f2 { fill: #9e9e9e; stroke: #111111; }
.f3 { fill: #555555; stroke: #111111; }
</style>
<defs>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#111111"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<!-- Row 1: Subsystem Architecture (Hardwired Two-Level Scheme, Left-to-Right) -->
<!-- 1. Gateway -->
<rect class="n" x="10" y="16" width="122" height="74"/>
<text class="t" x="18" y="34">irq_gateway</text>
<text class="s" x="18" y="50">6 peripheral lines</text>
<text class="s" x="18" y="64">pend_q pulse latch</text>
<text class="s" x="18" y="78">auto-clear on WB commit</text>

<!-- 2. Functional Classes -->
<rect class="n" x="144" y="16" width="194" height="74"/>
<text class="t" x="152" y="32">Functional Priority Classes</text>
<text class="s" x="152" y="46">Class 3 (Critical): Watchdog / Fault</text>
<text class="s" x="152" y="58">Class 2 (Real-time): Timer 0 (MTIP)</text>
<text class="s" x="152" y="70">Class 1 (Normal, RR): UART, SPI</text>
<text class="s" x="152" y="82">Class 0 (Bkgnd, RR): GPIO, I2C</text>

<!-- 3. Two-Level Arbiter -->
<rect class="n" x="350" y="16" width="186" height="74"/>
<text class="t" x="358" y="32">Two-Level Arbiter</text>
<text class="s" x="358" y="47">• Inter-Class: Fixed Priority (3 &gt; 2 &gt; 1 &gt; 0)</text>
<text class="s" x="358" y="60">• Intra-Class: Round-Robin in Cl. 1 &amp; 0</text>
<text class="s" x="358" y="73">• rr_ptr per class; rotates at commit</text>
<text class="s" x="358" y="85">• Bounded service: max (n − 1) wait</text>

<!-- 4. Dispatch Stage -->
<rect class="n" x="548" y="16" width="122" height="74"/>
<text class="t" x="556" y="34">Dispatch &amp; Trap</text>
<text class="s" x="556" y="50">mtvec vectored</text>
<text class="s" x="556" y="64">Base + 4 × ID</text>
<text class="s" x="556" y="78">Standard mret</text>

<!-- Row 1 Connectors (Left to Right) -->
<path class="a" d="M132 53H144"/>
<path class="a" d="M338 53H350"/>
<path class="a" d="M536 53H548"/>

<!-- Direct Flow down from Dispatch to Pipeline irq_pending -->
<path class="a" d="M609 90V144"/>

<!-- Row 2: Pipeline Stages (Reversed Flow: Right-to-Left) -->
<!-- 1. irq_pending (Right) -->
<rect class="b" x="552" y="144" width="118" height="44"/>
<text x="560" y="162">irq_pending</text>
<text class="s" x="560" y="176">∧ mstatus.MIE</text>

<!-- 2. accept @EX -->
<rect class="b" x="390" y="144" width="138" height="44"/>
<text x="398" y="162">accept @EX</text>
<text class="s" x="398" y="176">source ID captured</text>

<!-- 3. tag -> MEM -->
<rect class="b" x="270" y="144" width="96" height="44"/>
<text x="278" y="162">tag → MEM</text>
<text class="s" x="278" y="176">older instrs retire</text>

<!-- 4. commit @WB -->
<rect class="n" x="110" y="144" width="136" height="44"/>
<text class="t" x="118" y="162">commit @WB</text>
<text class="s" x="118" y="176">atomic trap redirect</text>

<!-- 5. mret -->
<rect class="m d" x="10" y="144" width="76" height="44"/>
<text x="32" y="162">mret</text>
<text class="s" x="18" y="176">resume PC</text>

<!-- Row 2 Connectors (Right-to-Left) -->
<path class="a" d="M552 166H528"/>
<path class="a" d="M390 166H366"/>
<path class="a" d="M270 166H246"/>
<path class="a d" d="M110 166H86"/>

<!-- Feedback paths from commit @WB (Upwards to Row 1) -->
<!-- Auto-clear to irq_gateway (left side) -->
<path class="a d" d="M145 144V116H71V90"/>
<text class="s" x="78" y="111">auto-clear pend_q[id]</text>

<!-- Pointer rotation to Two-Level Arbiter (right side) -->
<path class="a d" d="M210 144V116H443V90"/>
<text class="s" x="245" y="111">rotate rr_ptr[class]</text>

<!-- Row 3: Service Order Comparison Under Storm -->
<text class="t" x="10" y="244">Service order under burst storm (equal-class peripherals contending)</text>

<text x="10" y="268">Fixed (pure)</text>
<rect class="f1" x="110" y="254" width="24" height="20"/><rect class="f1" x="138" y="254" width="24" height="20"/>
<rect class="f1" x="166" y="254" width="24" height="20"/><rect class="f1" x="194" y="254" width="24" height="20"/>
<rect class="f1" x="222" y="254" width="24" height="20"/>
<text x="117" y="268">A</text><text x="145" y="268">A</text><text x="173" y="268">A</text><text x="201" y="268">A</text><text x="229" y="268">A</text>
<text class="s" x="256" y="268">B and C starve indefinitely while A keeps arriving</text>

<text x="10" y="302">Two-Level RR</text>
<rect class="f1" x="110" y="288" width="24" height="20"/><rect class="f2" x="138" y="288" width="24" height="20"/>
<rect class="f3" x="166" y="288" width="24" height="20"/><rect class="f1" x="194" y="288" width="24" height="20"/>
<rect class="f2" x="222" y="288" width="24" height="20"/><rect class="f3" x="250" y="288" width="24" height="20"/>
<text x="117" y="302">A</text><text x="145" y="302">B</text><text x="173" y="302" style="fill:#ffffff">C</text>
<text x="201" y="302">A</text><text x="229" y="302">B</text><text x="257" y="302" style="fill:#ffffff">C</text>
<text class="s" x="284" y="302">A, B, C share normal class; each waits at most (n − 1) services</text>

<text class="s" x="10" y="336">Bounded Response Time: R_s ≤ C_s + B + Σ_higher ⌈R_s / T_h⌉ · C_h + (n_class − 1) · C_peer</text>
<text class="s" x="10" y="349" style="font-style:italic;">Hardware guarantees: critical events preempt immediately; normal traffic cannot starve peers.</text>
</svg>
