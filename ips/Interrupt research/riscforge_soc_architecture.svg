<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="100%" height="auto" role="img" aria-label="RISCFORGE SoC block diagram. The RV32IM_Zicsr core fetches instructions through a fetch demux from BootROM or ISRAM, and sends loads and stores to a hybrid memory interface. That interface reaches DSRAM directly and sends only peripheral accesses to the AXI-Lite crossbar. The crossbar also connects to ISRAM, DSRAM and an AXI-Lite to APB bridge, which serves seven APB slots: I2C, Timer 0, UART, GPIO, SPI, Timer 1, and an AON Watchdog Timer. Interrupt lines from I2C, Timer 0, UART, GPIO, SPI and the AON WDT return to the core's interrupt arbiter.">
<style>
svg { background: #ffffff; }
:root {
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Archivo", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --paper: #ffffff;
  --ink: #18202c;
  --ink-2: #475063;
  --ink-3: #7a8394;
  --rule: #e0e5ec;
  --rule-2: #c6cdd8;
  --tint: #f4f6f9;
  --core: #2d56c8;  --core-f: rgba(45,86,200,.09);
  --mem: #0c8577;   --mem-f: rgba(12,133,119,.10);
  --bus: #7445bd;   --bus-f: rgba(116,69,189,.09);
  --per: #a8660c;   --per-f: rgba(190,120,20,.11);
  --irq: #c92c37;   --irq-f: rgba(201,44,55,.08);
  --mute: #98a0ac;  --mute-f: rgba(152,160,172,.08);
}
text { font-family: var(--sans); fill: var(--ink); font-size: 12px; }
.tt { font-weight: 600; font-size: 12.5px; }
.ts { font-size: 10.5px; fill: var(--ink-2); }
.tm { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-2); }
.ti { font-family: var(--mono); font-size: 10px; fill: var(--irq); }
.tlab { font-size: 10.5px; fill: var(--ink-2); font-style: italic; }
.tmu { fill: var(--ink-3); }
.tbus { fill: var(--bus); font-weight: 600; font-size: 11px; letter-spacing: .05em; }
rect { stroke-width: 1.2; }
.n-core { fill: var(--core-f); stroke: var(--core); }
.n-stage { fill: var(--paper); stroke: var(--core); }
.n-mem { fill: var(--mem-f); stroke: var(--mem); }
.n-bus { fill: var(--bus-f); stroke: var(--bus); }
.n-per { fill: var(--per-f); stroke: var(--per); }
.n-irq { fill: var(--irq-f); stroke: var(--irq); }
.n-plain { fill: var(--paper); stroke: var(--rule-2); }
.n-mute { fill: var(--mute-f); stroke: var(--mute); stroke-dasharray: 4 3; }
.e { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
.e-core { fill: none; stroke: var(--core); stroke-width: 1.6; }
.e-mem { fill: none; stroke: var(--mem); stroke-width: 1.5; }
.e-bus { fill: none; stroke: var(--bus); stroke-width: 1.5; }
.e-apb { fill: none; stroke: var(--bus); stroke-width: 2.6; }
.e-irq { fill: none; stroke: var(--irq); stroke-width: 1.4; stroke-dasharray: 5 4; }
.e-irqs { fill: none; stroke: var(--irq); stroke-width: 1.5; }
.e-mute { fill: none; stroke: var(--mute); stroke-width: 1.4; stroke-dasharray: 4 4; }
.e-thin { fill: none; stroke: var(--rule-2); stroke-width: 1; stroke-dasharray: 2 3; }
.ah { fill: var(--ink-2); }
.ah-core { fill: var(--core); }
.ah-mem { fill: var(--mem); }
.ah-bus { fill: var(--bus); }
.ah-irq { fill: var(--irq); }
.ah-mute { fill: var(--mute); }
</style>
<defs>
  <marker id="d1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" class="ah"/></marker>
  <marker id="d1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" class="ah-bus"/></marker>
  <marker id="d1i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" class="ah-irq"/></marker>
  <marker id="d1m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" class="ah-mute"/></marker>
