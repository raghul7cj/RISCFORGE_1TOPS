<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 502" role="img" aria-labelledby="fig-1-5-title fig-1-5-desc"><title id="fig-1-5-title">Figure 1.5: Interrupt capture, selection and commit</title><desc id="fig-1-5-desc">Class 2 fixed order: 7,22,24,26,20,21,23,25. Class 1 RR: 19,18,27. Class 0 RR: 17,16. Reading these blocks does not qualify all real source paths. Numbered nodes are explained in the key immediately below the diagram.</desc><defs><marker id="fig-1-5-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52647c"/></marker></defs><style>text{font-family:"IBM Plex Sans",Arial,sans-serif} .box{stroke-width:1.7}.arrow{fill:none;stroke:#52647c;stroke-width:2;marker-end:url(#fig-1-5-arrow)}</style><rect x="1" y="1" width="758" height="500" rx="12" fill="#ffffff" stroke="#dbe3ec"/><text x="24" y="33" font-size="21" fill="#18202c" font-weight="650"><tspan x="24" dy="0">Figure 1.5 · Interrupt capture, selection and commit</tspan></text><text x="24" y="82" font-size="15" fill="#52647c" font-weight="400"><tspan x="24" dy="0">Follow the numbered boxes; read the matching key below.</tspan></text><path class="arrow" d="M356 173 H396"/><path class="arrow" d="M570 238 V281"/><path class="arrow" d="M404 356 H364"/><rect class="box" x="24" y="108" width="332" height="130" rx="9" fill="#eef3ff" stroke="#315bb8"/><circle cx="49" cy="134" r="15" fill="#315bb8"/><text x="44" y="140" font-size="18" fill="#ffffff" font-weight="700"><tspan x="44" dy="0">1</tspan></text><text x="74" y="137" font-size="11" fill="#315bb8" font-weight="700"><tspan x="74" dy="0">SOURCE PATH</tspan></text><text x="39" y="169" font-size="19" fill="#18202c" font-weight="650"><tspan x="39" dy="0">Real source / mode</tspan></text><text x="39" y="216" font-size="14" fill="#475063" font-weight="400"><tspan x="39" dy="0">Cause 7 and causes 16–27</tspan></text><rect class="box" x="404" y="108" width="332" height="130" rx="9" fill="#eef3ff" stroke="#