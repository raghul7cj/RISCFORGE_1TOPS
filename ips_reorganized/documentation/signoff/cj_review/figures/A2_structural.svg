<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 740" class="dg" role="img" aria-labelledby="title desc">
<title id="title">A2 — IRQ and CSR authority inside top</title>
<desc id="desc">Named source instances, register boundaries and directed interfaces. Solid blue: payload or request. Teal: response or result feedback. Dashed amber: control or incomplete hook. Dotted gray: passive observation or testbench backdoor; labels distinguish these uses.</desc>
<defs>
  <marker id="ah-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2d56c8"/></marker>
  <marker id="ah-mem"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#0c8577"/></marker>
  <marker id="ah-bus"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#7445bd"/></marker>
  <marker id="ah-ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#a8660c"/></marker>
  <marker id="ah-irq"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#c92c37"/></marker>
  <marker id="ah-obs"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#626d7f"/></marker>
  <marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#98a0ac"/></marker>
  <marker id="ah"      viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#475063"/></marker>
</defs>
<style>
  :root {
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
    --ground: #ffffff; --paper: #ffffff; --ink: #18202c; --ink-2: #475063; --ink-3: #7a8394;
    --rule: #e0e5ec; --rule-2: #cbd5e1; --tint: #f8fafc;
    --core: #2d56c8; --core-f: rgba(45,86,200,.08);
    --mem:  #0c8577; --mem-f:  rgba(12,133,119,.08);
    --bus:  #7445bd; --bus-f:  rgba(116,69,189,.08);
    --per:  #a8660c; --per-f:  rgba(190,120,20,.09);
    --irq:  #c92c37; --irq-f:  rgba(201,44,55,.08);
    --tb:   #626d7f; --tb-f:   rgba(98,109,127,.08);
    --todo: #b45309; --todo-f: rgba(180,83,9,.08);
  }
  text { font-family: Arial, Helvetica, sans-serif; fill: #18202c; font-size: 11px; }
  .tt { font-weight: 600; font-size: 12.5px; fill: #18202c; }
  .ts { font-size: 10.5px; fill: #475063; }
  .tm { font-family: Consolas, "Courier New", monospace; font-size: 10px; fill: #475063; }
  .ti { font-family: Consolas, "Courier New", monospace; font-size: 9.5px; fill: #c92c37; font-weight: 500; }
  .tbus { font-size: 10.5px; font-weight: 600; fill: #7445bd; letter-spacing: .04em; }
  .tlab { font-size: 10px; fill: #475063; font-style: italic; }
  .tmu { fill: #7a8394; }
  .tbadge { font-family: Consolas, "Courier New", monospace; font-size: 9px; font-weight: 600; }
  rect { stroke-width: 1.2; }
  .n-core  { fill: #eff2fc; stroke: #2d56c8; }
  .n-stage { fill: #ffffff;       stroke: #2d56c8; stroke-width: 1.3; }
  .n-mem   { fill: #edf7f6;  stroke: #0c8577;  }
  .n-bus   { fill: #f3eff9;  stroke: #7445bd;  }
  .n-per   { fill: #faf5ed;  stroke: #a8660c;  }
  .n-irq   { fill: #fbf0f1;  stroke: #c92c37;  }
  .n-tb    { fill: #f2f3f5;   stroke: #626d7f;   }
  .n-todo  { fill: #faf3eb; stroke: #b45309; stroke-dasharray: 5 3; }
  .n-frame { fill: none;          stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .n-badge { stroke-width: 1; rx: 3px; }
  .e-core { fill: none; stroke: #2d56c8; stroke-width: 1.6; }
  .e-mem  { fill: none; stroke: #0c8577;  stroke-width: 1.5; }
  .e-bus  { fill: none; stroke: #7445bd;  stroke-width: 1.5; }
  .e-apb  { fill: none; stroke: #7445bd;  stroke-width: 2.4; }
  .e-ctrl { fill: none; stroke: #b45309; stroke-width: 1.4; stroke-dasharray: 6 4; }
  .e-irq  { fill: none; stroke: #c92c37;  stroke-width: 1.4; stroke-dasharray: 5 4; }
  .e-irqs { fill: none; stroke: #c92c37;  stroke-width: 1.5; }
  .e-obs  { fill: none; stroke: #626d7f;   stroke-width: 1.2; stroke-dasharray: 3 3; }
  .e-thin { fill: none; stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 2 3; }
</style>
<rect width="1060" height="740" fill="#ffffff"/>
<text x="24" y="28" class="tt" style="font-size:14px; letter-spacing:-0.01em;">A2 · IRQ and CSR authority inside top</text>
<rect class="n-frame" x="15" y="45" width="1030" height="680" rx="6"/>
<text class="tt tmu" x="27" y="63" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">top · core authority</text>
<path class="e-core" d="M 20,110 L 45,110" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="-2" y="90" width="68" height="16" rx="3"/>
<text class="tbadge" x="32" y="102" text-anchor="middle" fill="#2d56c8">raw[12:0]</text>
<rect class="n-core" x="45" y="75" width="220" height="95" rx="4"/>
<text class="tt" x="55" y="93">u_irq_gateway</text>
<text class="tm" x="55" y="109">raw[12:0] → pending</text>
<text class="ts" x="55" y="124">edge / event capture</text>
<path class="e-core" d="M 265,110 L 345,110" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="286" y="94" width="38" height="16" rx="3"/>
<text class="tbadge" x="305" y="106" text-anchor="middle" fill="#2d56c8">pend</text>
<rect class="n-core" x="345" y="75" width="225" height="95" rx="4"/>
<text class="tt" x="355" y="93">u_irq_arbiter</text>
<text class="ts" x="355" y="109">mie / MIE / mintprio</text>
<text class="ts" x="355" y="124">fixed / round-robin</text>
<path class="e-core" d="M 570,110 L 645,110" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="582" y="94" width="50" height="16" rx="3"/>
<text class="tbadge" x="607" y="106" text-anchor="middle" fill="#2d56c8">winner</text>
<rect class="n-core" x="645" y="75" width="375" height="95" rx="4"/>
<text class="tt" x="655" y="93">Execute · acceptance inside</text>
<text class="ts" x="655" y="109">winner + valid_E + exception priority</text>
<text class="ts" x="655" y="124">CSR address / old value / new value</text>
<path class="e-core" d="M 830,170 L 830,225" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="805" y="190" width="50" height="16" rx="3"/>
<text class="tbadge" x="830" y="202" text-anchor="middle" fill="#2d56c8">packet</text>
<rect class="n-stage" x="645" y="225" width="375" height="80" rx="4"/>
<text class="tt" x="655" y="243">Pipeline state (not new logic)</text>
<text class="ts" x="655" y="259">EX/MEM → Memory → MEM/WB</text>
<text class="ts" x="655" y="274">PC / cause / tval / class / MRET</text>
<path class="e-core" d="M 830,305 L 830,360" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="796" y="324" width="68" height="16" rx="3"/>
<text class="tbadge" x="830" y="336" text-anchor="middle" fill="#2d56c8">WB packet</text>
<rect class="n-core" x="645" y="360" width="375" height="95" rx="4"/>
<text class="tt" x="655" y="378">wb_commit</text>
<text class="ts" x="655" y="394">trap / MRET priority</text>
<text class="ts" x="655" y="409">committed cause → clear / RR</text>
<text class="ts" x="655" y="424">redirect → Fetch (A1)</text>
<rect class="n-core" x="320" y="535" width="700" height="155" rx="4"/>
<text class="tt" x="330" y="553">csr_file : csr_regfile</text>
<text class="tm" x="330" y="569">Normal WB write · trap update · MRET update: separate ports</text>
<text class="ts" x="330" y="584">mtvec / mepc / mstatus → WB target and state</text>
<text class="ts" x="330" y="599">One live context; software owns nested context saving</text>
<path class="e-core" d="M 680,170 L 680,210 L 380,210 L 380,535" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="388" y="202" width="104" height="16" rx="3"/>
<text class="tbadge" x="440" y="214" text-anchor="middle" fill="#2d56c8">csr_raddr[11:0]</text>
<path class="e-mem" d="M 440,535 L 440,225 L 710,225 L 710,170" marker-end="url(#ah-mem)"/>
<rect class="n-mem n-badge" x="478" y="217" width="104" height="16" rx="3"/>
<text class="tbadge" x="530" y="229" text-anchor="middle" fill="#0c8577">csr_rdata[31:0]</text>
<path class="e-core" d="M 730,305 L 730,340 L 510,340 L 510,535" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="528" y="332" width="104" height="16" rx="3"/>
<text class="tbadge" x="580" y="344" text-anchor="middle" fill="#2d56c8">normal WB write</text>
<path class="e-core" d="M 750,455 L 750,535" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="731" y="487" width="38" height="16" rx="3"/>
<text class="tbadge" x="750" y="499" text-anchor="middle" fill="#2d56c8">trap</text>
<path class="e-core" d="M 920,455 L 920,535" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="901" y="487" width="38" height="16" rx="3"/>
<text class="tbadge" x="920" y="499" text-anchor="middle" fill="#2d56c8">MRET</text>
<path class="e-mem" d="M 990,535 L 990,455" marker-end="url(#ah-mem)"/>
<rect class="n-mem n-badge" x="944" y="487" width="92" height="16" rx="3"/>
<text class="tbadge" x="990" y="499" text-anchor="middle" fill="#0c8577">CSR sidebands</text>
<path class="e-ctrl" d="M 1000,395 L 1030,395 L 1030,55 L 155,55 L 155,75" marker-end="url(#ah-ctrl)"/>
<rect class="n-ctrl n-badge" x="402" y="47" width="236" height="16" rx="3"/>
<text class="tbadge" x="520" y="59" text-anchor="middle" fill="var(--ctrl)">committed cause → clear_gateway[12:0]</text>
<path class="e-ctrl" d="M 970,360 L 970,65 L 455,65 L 455,75" marker-end="url(#ah-ctrl)"/>
<rect class="n-ctrl n-badge" x="581" y="57" width="218" height="16" rx="3"/>
<text class="tbadge" x="690" y="69" text-anchor="middle" fill="var(--ctrl)">wb_commit_irq / cause → RR advance</text>
<path class="e-ctrl" d="M 320,575 L 290,575 L 290,195 L 410,195 L 410,170" marker-end="url(#ah-ctrl)"/>
<rect class="n-ctrl n-badge" x="283" y="187" width="134" height="16" rx="3"/>
<text class="tbadge" x="350" y="199" text-anchor="middle" fill="var(--ctrl)">mie / MIE / mintprio</text>
<path class="e-core" d="M 265,145 L 280,145 L 280,655 L 320,655" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="201" y="392" width="158" height="16" rx="3"/>
<text class="tbadge" x="280" y="404" text-anchor="middle" fill="#2d56c8">pending → CSR IRQ inputs</text>
<text x="35" y="715" class="ts">raw[12:0] → gateway; Execute acceptance tags traps; wb_commit holds atomic trap/MRET authority.</text>
</svg>