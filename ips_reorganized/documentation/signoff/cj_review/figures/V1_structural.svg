<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" class="dg" role="img" aria-labelledby="title desc">
<title id="title">V1 — Real-core pipeline harness and sampled observations</title>
<desc id="desc">Named source instances, register boundaries and directed interfaces. Solid blue: payload or request. Teal: response or result feedback. Dashed amber: control or incomplete hook. Dotted gray: passive observation or testbench backdoor; labels distinguish these uses.</desc>
<defs>
  <marker id="ah-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#2d56c8"/></marker>
  <marker id="ah-mem"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#0c8577"/></marker>
  <marker id="ah-bus"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#7445bd"/></marker>
  <marker id="ah-ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#a8660c"/></marker>
  <marker id="ah-irq"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#c92c37"/></marker>
  <marker id="ah-obs"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#626d7f"/></marker>
  <marker id="ah-mute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#98a0ac"/></marker>
  <marker id="ah"      viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#475063"/></marker>
</defs>
<style>
  :root {
    --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
    --ground: #ffffff; --paper: #ffffff; --ink: #18202c; --ink-2: #475063; --ink-3: #7a8394;
    --rule: #e0e5ec; --rule-2: #cbd5e1; --tint: #f8fafc;
    --core: #2d56c8; --core-f: rgba(45,86,200,.08);
    --mem:  #0c8577; --mem-f:  rgba(12,133,119,.08);
    --bus:  #7445bd; --bus-f:  rgba(116,69,189,.08);
    --per:  #a8660c; --per-f:  rgba(190,120,20,.09);
    --irq:  #c92c37; --irq-f:  rgba(201,44,55,.08);
    --tb:   #626d7f; --tb-f:   rgba(98,109,127,.08);
    --todo: #b45309; --todo-f: rgba(180,83,9,.08);
  }
  text { font-family: Arial, Helvetica, sans-serif; fill: #18202c; font-size: 11px; }
  .tt { font-weight: 600; font-size: 12.5px; fill: #18202c; }
  .ts { font-size: 10.5px; fill: #475063; }
  .tm { font-family: Consolas, "Courier New", monospace; font-size: 10px; fill: #475063; }
  .ti { font-family: Consolas, "Courier New", monospace; font-size: 9.5px; fill: #c92c37; font-weight: 500; }
  .tbus { font-size: 10.5px; font-weight: 600; fill: #7445bd; letter-spacing: .04em; }
  .tlab { font-size: 10px; fill: #475063; font-style: italic; }
  .tmu { fill: #7a8394; }
  .tbadge { font-family: Consolas, "Courier New", monospace; font-size: 9px; font-weight: 600; }
  rect { stroke-width: 1.2; }
  .n-core  { fill: #eff2fc; stroke: #2d56c8; }
  .n-stage { fill: #ffffff;       stroke: #2d56c8; stroke-width: 1.3; }
  .n-mem   { fill: #edf7f6;  stroke: #0c8577;  }
  .n-bus   { fill: #f3eff9;  stroke: #7445bd;  }
  .n-per   { fill: #faf5ed;  stroke: #a8660c;  }
  .n-irq   { fill: #fbf0f1;  stroke: #c92c37;  }
  .n-tb    { fill: #f2f3f5;   stroke: #626d7f;   }
  .n-todo  { fill: #faf3eb; stroke: #b45309; stroke-dasharray: 5 3; }
  .n-frame { fill: none;          stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .n-badge { stroke-width: 1; rx: 3px; }
  .e-core { fill: none; stroke: #2d56c8; stroke-width: 1.6; }
  .e-mem  { fill: none; stroke: #0c8577;  stroke-width: 1.5; }
  .e-bus  { fill: none; stroke: #7445bd;  stroke-width: 1.5; }
  .e-apb  { fill: none; stroke: #7445bd;  stroke-width: 2.4; }
  .e-ctrl { fill: none; stroke: #b45309; stroke-width: 1.4; stroke-dasharray: 6 4; }
  .e-irq  { fill: none; stroke: #c92c37;  stroke-width: 1.4; stroke-dasharray: 5 4; }
  .e-irqs { fill: none; stroke: #c92c37;  stroke-width: 1.5; }
  .e-obs  { fill: none; stroke: #626d7f;   stroke-width: 1.2; stroke-dasharray: 3 3; }
  .e-thin { fill: none; stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 2 3; }
</style>
<rect width="1100" height="720" fill="#ffffff"/>
<text x="24" y="28" class="tt" style="font-size:14px; letter-spacing:-0.01em;">V1 · Real-core pipeline harness and sampled observations</text>
<rect class="n-frame" x="15" y="45" width="1070" height="655" rx="6"/>
<text class="tt tmu" x="27" y="63" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">pipeline_tb  ·  pipeline.f  ·  RESET_PC=0x80000000</text>
<rect class="n-frame" x="35" y="75" width="1030" height="135" rx="6"/>
<text class="tt tmu" x="47" y="93" style="font-size:11px; text-transform:uppercase; letter-spacing:0.05em;">pipeline_env (class ownership, not DUT hierarchy)</text>
<rect class="n-todo" x="55" y="110" width="270" height="80" rx="4" stroke-dasharray="6 4"/>
<text class="tt" x="65" y="128">scenario · TODO</text>
<text class="ts" x="65" y="144">configure(driver) / run(driver)</text>
<text class="ts" x="65" y="159">user stimulus TODO</text>
<path class="e-core" d="M 325,150 L 385,150" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="333" y="134" width="44" height="16" rx="3"/>
<text class="tbadge" x="355" y="146" text-anchor="middle" fill="#2d56c8">calls</text>
<rect class="n-tb" x="385" y="110" width="280" height="80" rx="4"/>
<text class="tt" x="395" y="128">control_driver</text>
<text class="ts" x="395" y="144">owns virtual bus interface</text>
<text class="ts" x="395" y="159">negedge control drive</text>
<rect class="n-todo" x="715" y="110" width="330" height="80" rx="4" stroke-dasharray="6 4"/>
<text class="tt" x="725" y="128">monitor / callback hooks</text>
<text class="ts" x="725" y="144">immutable phase-tagged samples</text>
<text class="ts" x="725" y="159">model / effects / bins TODO</text>
<rect class="n-core" x="55" y="245" width="280" height="165" rx="4"/>
<text class="tt" x="65" y="263">dut : top</text>
<text class="ts" x="65" y="279">five stages → A1</text>
<text class="ts" x="65" y="294">WB mux / csr_file</text>
<text class="ts" x="65" y="309">commit / hazard / IRQ → A1/A2</text>
<rect class="n-bus" x="405" y="245" width="280" height="165" rx="4"/>
<text class="tt" x="415" y="263">bus: pipeline_bus_if</text>
<text class="ts" x="415" y="279">clock / reset / IRQ / policy</text>
<text class="ts" x="415" y="294">IMEM / LSU requests + returns</text>
<text class="ts" x="415" y="309">live_snapshot; pre/post copies</text>
<path class="e-ctrl" d="M 525,190 L 525,245" marker-end="url(#ah-ctrl)"/>
<rect class="n-ctrl n-badge" x="467" y="210" width="116" height="16" rx="3"/>
<text class="tbadge" x="525" y="222" text-anchor="middle" fill="var(--ctrl)">driver → controls</text>
<path class="e-core" d="M 405,290 L 335,290" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="288" y="270" width="164" height="16" rx="3"/>
<text class="tbadge" x="370" y="282" text-anchor="middle" fill="#2d56c8">controls / response → DUT</text>
<path class="e-core" d="M 335,350 L 405,350" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="312" y="354" width="116" height="16" rx="3"/>
<text class="tbadge" x="370" y="366" text-anchor="middle" fill="#2d56c8">DUT request → bus</text>
<rect class="n-mem" x="745" y="240" width="305" height="75" rx="4"/>
<text class="tt" x="755" y="258">imem_model</text>
<text class="tm" x="755" y="274">4096 × 32 @ 0x80000000</text>
<text class="ts" x="755" y="289">registered addr; +IMEM_HEX</text>
<path class="e-core" d="M 685,265 L 745,265" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="666" y="247" width="98" height="16" rx="3"/>
<text class="tbadge" x="715" y="259" text-anchor="middle" fill="#2d56c8">IMEM addr/en →</text>
<path class="e-mem" d="M 745,295 L 685,295" marker-end="url(#ah-mem)"/>
<rect class="n-mem n-badge" x="669" y="297" width="92" height="16" rx="3"/>
<text class="tbadge" x="715" y="309" text-anchor="middle" fill="#0c8577">← rdata[31:0]</text>
<rect class="n-mem" x="745" y="335" width="305" height="80" rx="4"/>
<text class="tt" x="755" y="353">dmem_model</text>
<text class="tm" x="755" y="369">32768 bytes @ 0x80001000</text>
<text class="ts" x="755" y="384">one owner; wait / error policy</text>
<text class="ts" x="755" y="399">store effects; no ISA oracle</text>
<path class="e-core" d="M 685,360 L 745,360" marker-end="url(#ah-core)"/>
<rect class="n-core n-badge" x="681" y="342" width="68" height="16" rx="3"/>
<text class="tbadge" x="715" y="354" text-anchor="middle" fill="#2d56c8">LSU req →</text>
<path class="e-mem" d="M 745,395 L 685,395" marker-end="url(#ah-mem)"/>
<rect class="n-mem n-badge" x="657" y="397" width="116" height="16" rx="3"/>
<text class="tbadge" x="715" y="409" text-anchor="middle" fill="#0c8577">← rdata/stall/err</text>
<rect class="n-tb" x="55" y="455" width="440" height="115" rx="4"/>
<text class="tt" x="65" y="473">probe_adapter</text>
<text class="ts" x="65" y="489">DUT taps → bus.live_snapshot</text>
<text class="tm" x="65" y="504">posedge #1step: pre-edge</text>
<text class="tm" x="65" y="519">+1 ps: post-NBA; same cycle ID</text>
<rect class="n-todo" x="545" y="455" width="505" height="115" rx="4" stroke-dasharray="6 4"/>
<text class="tt" x="555" y="473">Execution requirements</text>
<text class="ts" x="555" y="489">IMEM image + configured user hooks</text>
<text class="tm" x="555" y="504">plumbing-only: reset held, no checks</text>
<path class="e-obs" d="M 195,410 L 195,455" marker-end="url(#ah-obs)"/>
<rect class="n-obs n-badge" x="104" y="424" width="182" height="16" rx="3"/>
<text class="tbadge" x="195" y="436" text-anchor="middle" fill="var(--obs)">passive taps / live_snapshot</text>
<path class="e-obs" d="M 495,510 L 520,510 L 520,430 L 575,430 L 575,410" marker-end="url(#ah-obs)"/>
<rect class="n-obs n-badge" x="477" y="462" width="86" height="16" rx="3"/>
<text class="tbadge" x="520" y="474" text-anchor="middle" fill="var(--obs)">copies → bus</text>
<path class="e-obs" d="M 685,280 L 715,280 L 715,175 L 715,175" marker-end="url(#ah-obs)"/>
<rect class="n-obs n-badge" x="636" y="212" width="128" height="16" rx="3"/>
<text class="tbadge" x="700" y="224" text-anchor="middle" fill="var(--obs)">snapshots → monitor</text>
<text x="55" y="685" class="ts">Observation delivery exists; independent checking remains user work.</text>
</svg>