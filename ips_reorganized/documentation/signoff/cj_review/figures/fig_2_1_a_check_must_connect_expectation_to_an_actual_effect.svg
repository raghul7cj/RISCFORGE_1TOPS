<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 685" role="img" aria-labelledby="fig-2-1-title fig-2-1-desc"><title id="fig-2-1-title">Figure 2.1: A check must connect expectation to an actual effect</title><desc id="fig-2-1-desc">Verification target: stimulus and contract drive an independent expectation in parallel with actual DUT observation. The two branches meet at the effective check; the model is not derived by copying the observed DUT result. Amber nodes remain engineering work. Numbered nodes are explained in the key immediately below the diagram.</desc><defs><marker id="fig-2-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#52647c"/></marker></defs><style>text{font-family:"IBM Plex Sans",Arial,sans-serif} .box{stroke-width:1.7}.arrow{fill:none;stroke:#52647c;stroke-width:2;marker-end:url(#fig-2-1-arrow)}</style><rect x="1" y="1" width="758" height="683" rx="12" fill="#ffffff" stroke="#dbe3ec"/><text x="24" y="33" font-size="21" fill="#18202c" font-weight="650"><tspan x="24" dy="0">Figure 2.1 · A check must connect expectation to an actual</tspan><tspan x="24" dy="24">effect</tspan></text><text x="24" y="82" font-size="15" fill="#52647c" font-weight="400"><tspan x="24" dy="0">Follow the numbered boxes; read the matching key below.</tspan></text><path class="arrow" d="M380 238 V260 H190 V281"/><path class="arrow" d="M380 238 V260 H570 V281"/><path class="arrow" d="M190 421 V445 H380 V464"/><path class="arrow" d="M570 421 V445 H380 V464"/><rect class="box" x="214" y="108" width="332" height="130" rx="9" fill="#fff8e9" stroke="#a0650a" stroke-dasharray="7 4"/><circle cx="239" cy="134" r="15" fill="#a0650a"/><text x="234" y="140" font-size="18" fill="#ffffff" font-weight="700"><tspan x="234" dy="0">1</tspan></text><text x="264" y="137" font-size="11" fill="#a0650a" font-weight="700"><tspan x="264" dy="0">PENDING / TARGET</tspan></text><text x="229" y="169" font-size="19" fill="#18202c" font-weight="650"><tspan x="229" dy="0">Stimulus and setup</tspan></text><text x="229" y="216" font-size="14" fill="#475063" font-weight="400"><tspan x="229" dy="0">Program / pins / legal delays</tspan></text><rect class="box" x="24" y="291" width="332" height="130" rx="9" fill="#eef3ff" stroke="#315bb8"/><circle cx="49" cy="317" r="15" fill="#315bb8"/><text x="44" y="323" font-size="18" fill="#ffffff" font-weight="700"><tspan x="44" dy="0">2</tspan></text><text x="74" y="320" font-size="11" fill="#315bb8" font-weight="700"><tspan x="74" dy="0">SOURCE PATH</tspan></text><text x="39" y="352" font-size="19" fill="#18202c" font-weight="650"><tspan x="39" dy="0">Observe the DUT</tspan></text><text x="39" y="399" font-size="14" fill="#475063" font-weight="400"><tspan x="39" dy="0">Events, state and effects</tspan></text><rect class="box" x="404" y="291" width="332" height="130" rx="9" fill="#fff8e9" stroke="#a0650a" stroke-dasharray="7 4"/><circle cx="429" cy="317" r="15" fill="#a0650a"/><text x="424" y="323" font-size="18" fill="#ffffff" font-weight="700"><tspan x="424" dy="0">3</tspan></text><text x="454" y="320" font-size="11" fill="#a0650a" font-weight="700"><tspan x="454" dy="0">PENDING / TARGET</tspan></text><text x="419" y="352" font-size="19" fill="#18202c" font-weight="650"><tspan x="419" dy="0">Independent expectation</tspan></text><text x="419" y="399" font-size="14" fill="#475063" font-weight="400"><tspan x="419" dy="0">Contract-derived model</tspan></text><rect class="box" x="214" y="474" width="332" height="130" rx="9" fill="#fff8e9" stroke="#a0650a" stroke-dasharray="7 4"/><circle cx="239" cy="500" r="15" fill="#a0650a"/><text x="234" y="506" font-size="18" fill="#ffffff" font-weight="700"><tspan x="234" dy="0">4</tspan></text><text x="264" y="503" font-size="11" fill="#a0650a" font-weight="700"><tspan x="264" dy="0">PENDING / TARGET</tspan></text><text x="229" y="535" font-size="19" fill="#18202c" font-weight="650"><tspan x="229" dy="0">Effective check and</tspan><tspan x="229" dy="22">record</tspan></text><text x="229" y="582" font-size="14" fill="#475063" font-weight="400"><tspan x="229" dy="0">Compare → verdict → evidence</tspan></text></svg>